name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Temporary workaround: the existing lockfile still resolves Next 15.5.5,
      # while package.json pins 15.5.28. Regenerate/commit a verified lockfile
      # in a follow-up change and switch this step back to npm ci.
      - name: Install declared dependencies (lockfile reconciliation pending)
        run: npm install --no-package-lock --no-save
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production application
        run: npm run build
